name: Crystal
description: 'Crystal (Crystal Semiconductor) was a hardtech company that designed audio and mixed-signal
  semiconductor chips. Kleiner Perkins partnered with the company in 1986 at the early stage, and Crystal
  was subsequently acquired by Cirrus Logic. The company was surfaced from the Kleiner Perkins portfolio
  and added to the API Evangelist network as a lead. It operated as a fabless chip designer rather than
  a software or platform business, and no longer exists as an independent entity: it publishes no website,
  no developer portal, and no public API surface of any kind. This profile is retained as a historical
  portfolio record and is not an API provider.'
